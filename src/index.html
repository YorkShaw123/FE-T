t<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flora Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: #11161e;
            color: #8b93a7;
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
        }
        .loader {
            text-align: center;
        }
        .logo {
            font-size: 44px;
            margin-bottom: 18px;
            animation: pulse 1.6s ease-in-out infinite;
        }
        .title { color: #e6e9f0; font-size: 18px; margin-bottom: 10px; }
        .spinner {
            width: 34px;
            height: 34px;
            margin: 20px auto 0;
            border: 3px solid rgba(139, 147, 167, 0.25);
            border-top-color: #6c8cff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="logo">
            <!-- 与默认暗色界面顶栏 .brand-mark 一致的白底绿色树形标记 -->
            <svg viewBox="0 0 38 38" width="96" height="96" aria-hidden="true">
                <rect width="38" height="38" rx="12" fill="#edf5f1"/>
                <g fill="none" stroke="#32c99d" stroke-width="1.5">
                    <path d="M8 27C8 24.7909 12.9249 23 19 23C25.0751 23 30 24.7909 30 27" transform="rotate(-8 19 27)"/>
                    <path d="M12 21C12 18.7909 16.0294 17 21 17C25.9706 17 30 18.7909 30 21" transform="rotate(-8 21 21)"/>
                    <path d="M17 15C17 12.7909 19.9101 11 23.5 11C27.0899 11 30 12.7909 30 15" transform="rotate(-8 23.5 15)"/>
                </g>
                <rect x="18" y="9" width="2" height="23" fill="#32c99d" transform="rotate(8 19 20.5)"/>
            </svg>
        </div>
        <div class="title">Flora Editor - AI文字创作助手</div>
        <div>正在启动本地服务，请稍候…</div>
        <div class="spinner"></div>
    </div>
</body>
</html>
