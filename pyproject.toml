[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 新后端大量使用 async 用例（Agent 图、编排器、重试）。
# auto 模式让 `async def test_...` 直接可跑，不必每个用例挂装饰器。
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["build", "dist", "src-tauri/target"]

[tool.ruff.lint]
# 从可靠、低争议的基础规则开始；后续按实际收益渐进增加。
select = ["E4", "E7", "E9", "F"]
