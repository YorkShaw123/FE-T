[package]
name = "flora-editor"
version = "1.0.1"
description = "雨生编辑器 - AI文字创作助手桌面版"
authors = ["Flora"]
edition = "2021"

[lib]
name = "flora_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
