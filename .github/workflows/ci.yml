name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check server scripts tests

      - name: Test Python
        run: python -m pytest

      - name: Check JavaScript syntax
        shell: pwsh
        run: Get-ChildItem server/static/js/*.js | ForEach-Object { node --check $_.FullName }

      - name: Prepare Tauri sidecar placeholder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          New-Item -ItemType File -Force src-tauri/binaries/flora-server-x86_64-pc-windows-msvc.exe | Out-Null

      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
